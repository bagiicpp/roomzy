[project]
name = "roomzy"
version = "0.1.0"
description = "Roomzy backend and machine learning"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.29.0",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]
